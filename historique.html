<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Games Room · Historique</title>
<meta name="theme-color" content="#233a2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Games Room">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#24382e;
    --board-deep:#1b2c24;
    --chalk:#f3efe4;
    --chalk-dim:#c9c4b4;
    --butter:#e9c46a;
    --red-chalk:#e76f51;
    --blue-chalk:#8ecae6;
    --line:rgba(243,239,228,.18);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Fredoka',system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(233,196,106,.07), transparent 60%),
      linear-gradient(var(--board), var(--board-deep));
    color:var(--chalk);
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;
    padding:20px 16px 40px;
  }
  .frame{width:100%;max-width:460px}
  header{text-align:center;margin-bottom:14px;position:relative}
  h1{font-weight:700;font-size:1.9rem;letter-spacing:.5px}
  .tagline{color:var(--chalk-dim);font-size:.9rem;margin-top:2px}
  .back-link{display:inline-block;margin-top:8px;color:var(--chalk-dim);font-size:.82rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
  .refresh-btn{position:absolute;top:0;right:0;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;cursor:pointer}
  .refresh-btn:active{transform:scale(.92)}
  .refresh-btn.spin{animation:spin .7s linear}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .card{
    background:linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.02));
    backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
    border:1px solid rgba(243,239,228,.13);
    border-radius:var(--radius);
    padding:18px 16px;
    margin-bottom:14px;
    box-shadow:0 10px 26px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .muted{color:var(--chalk-dim);font-size:.85rem;line-height:1.45;text-align:center}
  .hidden{display:none !important}

  .date-row{display:flex;align-items:center;gap:6px;margin-bottom:12px}
  .date-picker-wrap{flex:1;position:relative}
  input[type=date]{
    width:100%;
    background:rgba(0,0,0,.25);
    border:1.5px dashed var(--line);
    border-radius:10px;
    color:var(--chalk);
    font-family:'Fredoka',sans-serif;
    font-size:.92rem;
    padding:9px 10px;
    outline:none;
    color-scheme: dark;
    text-align:center;
  }
  input[type=date]::-webkit-date-and-time-value{ text-align:center; }
  input[type=date]:focus{border-color:var(--butter)}

  .filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px}
  .filter-row::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.82rem;cursor:pointer;white-space:nowrap;transition:filter .15s}
  .chip.active{background:linear-gradient(160deg,#eecd7c,var(--butter));color:#3a2c10;border-color:transparent;font-weight:600}
  .chip:active{filter:brightness(.94)}

  .day-header{font-size:.9rem;font-weight:600;color:var(--butter);margin:2px 2px 10px}

  .hrow{
    display:flex;align-items:flex-start;gap:10px;
    padding:10px 12px;border-radius:10px;
    background:rgba(0,0,0,.18);
    margin-bottom:6px;
  }
  .htime{color:var(--chalk-dim);font-size:.72rem;width:36px;flex-shrink:0;padding-top:2px;font-family:'Space Mono',monospace}
  .hbody{flex:1;min-width:0}
  .htitle{font-weight:600;font-size:.9rem}
  .hdetail{color:var(--chalk-dim);font-size:.78rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hresult{font-weight:600;font-size:.82rem;margin-top:4px;color:var(--butter)}
</style>
</head>
<body>
<div class="frame">
  <header>
    <h1>📊 Historique</h1>
    <div class="tagline">Toutes les parties, tous les jours</div>
    <a class="back-link" href="index.html">← Retour à l'accueil</a>
    <div class="refresh-btn" id="refresh-btn" onclick="loadAll(true)">🔄</div>
  </header>

  <div class="date-row">
    <div class="date-picker-wrap">
      <input type="date" id="date-picker" onchange="onDateChange()">
    </div>
  </div>

  <div class="filter-row" id="filter-row"></div>

  <div class="day-header" id="day-title"></div>

  <div class="card hidden" id="sec-loading">
    <p class="muted">Chargement…</p>
  </div>
  <div class="card hidden" id="sec-empty">
    <p class="muted" id="empty-text">Aucune partie ce jour-là.</p>
  </div>

  <div id="list"></div>
</div>

<script>
const SB_URL = "https://mqfyuprpztiyfpleannt.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xZnl1cHJwenRpeWZwbGVhbm50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzMjg3MjUsImV4cCI6MjA4OTkwNDcyNX0.4Fvc-fNlwhVp0HvOEL-Z92i9W4YvVSAgen0ihBzlGOk";
const HEADERS = {
  "apikey": SB_KEY,
  "Authorization": "Bearer " + SB_KEY,
  "Content-Type": "application/json"
};
const $ = id => document.getElementById(id);
function esc(s){ return String(s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;'); }

const GAME_FILTERS = [
  {key:'all', label:'Tous'},
  {key:'vt', label:'🐄 Vache & Taureau'},
  {key:'sk', label:'🎴 Skyjo'},
  {key:'tm', label:'🧠 The Mind'},
  {key:'cb', label:'🃏 Chkobba'},
  {key:'bw', label:'📖 Bent Walad'}
];
let activeFilter = 'all';
let allEntries = [];
let selectedDate = new Date();

async function fetchResults(table){
  try{
    const r = await fetch(SB_URL+"/rest/v1/"+table+"?select=*&order=finished_at.desc&limit=500", {headers:HEADERS});
    if(!r.ok) return [];
    return await r.json();
  }catch(e){ return []; }
}

function buildEntries(vt, sk, tm, cb, bw){
  const entries = [];
  vt.forEach(r => entries.push({
    ts: r.finished_at, game:'vt', emoji:'🐄', title:'Vache &amp; Taureau',
    detail: esc(r.p1_name)+' vs '+esc(r.p2_name),
    result: '🏆 '+esc(r.winner_name)
  }));
  sk.forEach(r => entries.push({
    ts: r.finished_at, game:'sk', emoji:'🎴', title:'Skyjo'+(r.max_players>2?' · '+r.max_players+' joueurs':''),
    detail: (r.players||[]).map(esc).join(', '),
    result: '🏆 '+esc(r.winner_name)
  }));
  tm.forEach(r => entries.push({
    ts: r.finished_at, game:'tm', emoji:'🧠', title:'The Mind · '+r.max_players+' joueurs',
    detail: (r.players||[]).map(esc).join(', '),
    result: r.won ? '✅ Niveau '+r.level_reached+' (gagné)' : '❌ Niveau '+r.level_reached
  }));
  cb.forEach(r => {
    const aNames = (r.side_a_names||[]).map(esc).join(' & ');
    const bNames = (r.side_b_names||[]).map(esc).join(' & ');
    const winNames = r.winner_side==='a' ? aNames : bNames;
    entries.push({
      ts: r.finished_at, game:'cb', emoji:'🃏', title:'Chkobba'+(r.max_players>2?' · '+r.max_players+' joueurs':''),
      detail: aNames+' vs '+bNames,
      result: '🏆 '+winNames+' · '+r.side_a_score+'–'+r.side_b_score
    });
  });
  bw.forEach(r => entries.push({
    ts: r.finished_at, game:'bw', emoji:'📖', title:'Bent Walad'+((r.players||[]).length>2?' · '+r.players.length+' joueurs':''),
    detail: (r.players||[]).map(esc).join(', '),
    result: '🏆 '+esc(r.winner_name)
  }));
  entries.sort((a,b) => new Date(b.ts) - new Date(a.ts));
  return entries;
}

function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function dateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function dayLabel(d){
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(today.getDate()-1);
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  if(dd.getTime()===today.getTime()) return "Aujourd'hui";
  if(dd.getTime()===yesterday.getTime()) return "Hier";
  if(dd.getTime()===tomorrow.getTime()) return "Demain";
  return capitalize(d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}));
}

function renderChips(){
  $('filter-row').innerHTML = GAME_FILTERS.map(f =>
    '<div class="chip'+(f.key===activeFilter?' active':'')+'" onclick="setFilter(\''+f.key+'\')">'+f.label+'</div>'
  ).join('');
}
function setFilter(key){ activeFilter = key; renderChips(); renderList(); }

function onDateChange(){
  const v = $('date-picker').value;
  if(v){
    const [y,m,d] = v.split('-').map(Number);
    selectedDate = new Date(y, m-1, d);
  }
  renderList();
}
function syncDatePicker(){ $('date-picker').value = dateKey(selectedDate); }

function renderList(){
  $('day-title').textContent = dayLabel(selectedDate);
  const dk = dateKey(selectedDate);
  const dayEntries = allEntries.filter(e => dateKey(new Date(e.ts)) === dk);
  const entries = activeFilter==='all' ? dayEntries : dayEntries.filter(e => e.game===activeFilter);
  $('sec-loading').classList.add('hidden');
  if(!entries.length){
    $('list').innerHTML = '';
    $('sec-empty').classList.remove('hidden');
    return;
  }
  $('sec-empty').classList.add('hidden');
  $('list').innerHTML = entries.map(e => {
    const time = new Date(e.ts).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    return '<div class="hrow"><span class="htime">'+time+'</span>'+
      '<div class="hbody"><div class="htitle">'+e.emoji+' '+e.title+'</div>'+
      '<div class="hdetail">'+e.detail+'</div>'+
      '<div class="hresult">'+e.result+'</div></div></div>';
  }).join('');
}

async function loadAll(isRefresh){
  if(isRefresh) $('refresh-btn').classList.add('spin');
  if(!allEntries.length) $('sec-loading').classList.remove('hidden');
  const [vt, sk, tm, cb, bw] = await Promise.all([
    fetchResults('vt_results'), fetchResults('sk_results'), fetchResults('tm_results'),
    fetchResults('cb_results'), fetchResults('bw_results')
  ]);
  allEntries = buildEntries(vt, sk, tm, cb, bw);
  renderChips();
  renderList();
  if(isRefresh) setTimeout(()=>$('refresh-btn').classList.remove('spin'), 700);
}

syncDatePicker();
loadAll(false);
</script>
<script src="install-tutorial.js" defer></script>
</body>
</html>
