<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Games Room · Historique</title>
<meta name="theme-color" content="#14171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Games Room">
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icons/gr-180.png">
<link rel="icon" href="icons/gr-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#14171a; --surface:#22262a; --surface2:#1d2024; --fg:#f3efe4; --dim:#8e918f; --gold:#e9c46a; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Fredoka',system-ui,sans-serif;background:var(--bg);color:var(--fg);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  }
  .frame{width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px}
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}

  .top{display:flex;align-items:center;gap:12px}
  .icon-btn{width:44px;height:44px;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px;text-decoration:none;color:var(--fg);flex:none}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn.spin span{display:inline-block;animation:spin .7s linear}
  @keyframes spin{to{transform:rotate(360deg)}}
  .top .ttl{flex:1;min-width:0}
  .top small{display:block;font-size:13px;color:var(--dim)}
  .top h1{font-size:26px;font-weight:700;letter-spacing:-.3px;line-height:1.2}

  .days{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:14px;padding:4px}
  .days button.arrow{width:42px;height:40px;border-radius:11px;font-size:20px;color:#a9aca9;flex:none}
  .days button.arrow:active{background:#2a2e33}
  .days button.arrow:disabled{opacity:.25}
  .day{flex:1;position:relative;height:40px;border-radius:11px;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;overflow:hidden}
  .day input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:var(--surface);border-radius:16px;padding:10px 12px}
  .stat b{display:block;font-size:22px;font-weight:700;line-height:1.1}
  .stat span{font-size:12px;color:var(--dim)}

  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--surface);color:#c9ccc9;font-size:13.5px;font-weight:500;white-space:nowrap}
  .chip i{font-style:normal;font-size:12px;opacity:.7}
  .chip.on{background:var(--fg);color:var(--bg);font-weight:600}

  .label{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin:4px 2px -4px}
  .empty{background:var(--surface);border-radius:18px;padding:28px 18px;text-align:center;color:var(--dim);font-size:14px;line-height:1.5}
  .empty b{display:block;font-size:30px;margin-bottom:4px}

  .list{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:12px;align-items:stretch;background:var(--surface);border-radius:18px;padding:10px}
  .badge{width:52px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--c);color:var(--t)}
  .body{flex:1;min-width:0;padding:2px 0}
  .head{display:flex;align-items:baseline;gap:8px}
  .name{font-weight:600;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .time{font-family:'Space Mono',monospace;font-size:11px;color:var(--dim);flex:none}
  .who{font-size:12.5px;color:var(--dim);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hidden{display:none!important}
  .res{font-size:13.5px;font-weight:600;color:var(--gold);margin-top:4px;line-height:1.3}
</style>
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<div class="frame">
  <div class="top">
    <a class="icon-btn" href="index.html" aria-label="Retour à l'accueil">←</a>
    <div class="ttl"><small>Toutes les parties</small><h1>Historique</h1></div>
    <button class="icon-btn" id="refresh-btn" onclick="loadAll(true)" aria-label="Actualiser"><span>↻</span></button>
  </div>

  <div class="days">
    <button class="arrow" onclick="shiftDay(-1)" aria-label="Jour précédent">‹</button>
    <label class="day"><span id="day-title"></span><input type="date" id="date-picker" onchange="onDateChange()"></label>
    <button class="arrow" id="next-day" onclick="shiftDay(1)" aria-label="Jour suivant">›</button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="chips" id="filter-row"></div>
  <div class="empty" id="sec-loading">Chargement…</div>
  <div class="empty hidden" id="sec-empty"><b>🎲</b>Aucune partie ce jour-là.</div>
  <div class="list" id="list"></div>
</div>

<script>
const SB_URL = "https://mqfyuprpztiyfpleannt.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xZnl1cHJwenRpeWZwbGVhbm50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzMjg3MjUsImV4cCI6MjA4OTkwNDcyNX0.4Fvc-fNlwhVp0HvOEL-Z92i9W4YvVSAgen0ihBzlGOk";
const HEADERS = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" };
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;'); }

// Every game of the home page, with the colours of its tile.
const GAMES = {
  vt:  { name:'Vache & Taureau', emoji:'🐄', c:'#f4ecd8', t:'#5a2a1c' },
  dm:  { name:'Dlilek Mlek', emoji:'💼', c:'#120f1f', t:'#f2c14e' },
  ttt: { name:'Morpion', emoji:'⭕', c:'#fbfaf4', t:'#1f3c88' },
  mot: { name:'1, 2, 3 Mot !', emoji:'🔤', c:'#ff6b2c', t:'#fff' },
  sk:  { name:'Skyjo', emoji:'🎴', c:'#dff1ff', t:'#123a6b' },
  tm:  { name:'The Mind', emoji:'🧠', c:'#2a2170', t:'#d9d0ff' },
  cb:  { name:'Chkobba', emoji:'🃏', c:'#1f5b43', t:'#fdf6e3' },
  bw:  { name:'Bent Walad', emoji:'📖', c:'#e8d5b0', t:'#2b2118' },
  in:  { name:"L'Intrus", emoji:'🕵️', c:'#1d2a2f', t:'#efe9dc' },
  ag:  { name:'Agents secrets', emoji:'🕶️', c:'#0c1726', t:'#e6eefc' },
  bl:  { name:'Bluff', emoji:'👑', c:'#4d1428', t:'#c9a227' },
  ui:  { name:'Un indice chacun', emoji:'💡', c:'#efeaff', t:'#2d2a4a' },
  kl:  { name:'EKLB', emoji:'🔄', c:'#2a1a55', t:'#f4efff' },
  sko: { name:'Skonopoly', emoji:'🎲', c:'#e9f2fa', t:'#0a4f9c' },
  tb:  { name:'Taboo', emoji:'🚫', c:'#b81d33', t:'#fff4e0' }
};
let activeFilter = 'all';
let allEntries = [];
let selectedDate = new Date(); selectedDate.setHours(0, 0, 0, 0);

async function fetchRows(table){
  try{
    const r = await fetch(SB_URL + "/rest/v1/" + table + "?select=*&order=finished_at.desc&limit=500", {headers:HEADERS});
    if(!r.ok) return [];
    return await r.json();
  }catch(e){ return []; }
}
const names = a => (a || []).map(esc).join(', ');
const nPlayers = n => n > 2 ? ' · ' + n + ' joueurs' : '';

function buildEntries(d){
  const out = [];
  const push = (game, ts, sub, who, res, ps) => out.push({ game, ts, sub: sub || '', who, res, ps: (ps || []).filter(Boolean) });
  d.vt.forEach(r => push('vt', r.finished_at, '', esc(r.p1_name) + ' vs ' + esc(r.p2_name), '🏆 ' + esc(r.winner_name), [r.p1_name, r.p2_name]));
  d.sk.forEach(r => push('sk', r.finished_at, nPlayers(r.max_players), names(r.players), '🏆 ' + esc(r.winner_name), r.players));
  d.tm.forEach(r => push('tm', r.finished_at, nPlayers(r.max_players), names(r.players), r.won ? '✅ Niveau ' + r.level_reached + ' (gagné)' : '❌ Niveau ' + r.level_reached, r.players));
  d.cb.forEach(r => {
    const a = (r.side_a_names || []).map(esc).join(' & '), b = (r.side_b_names || []).map(esc).join(' & ');
    push('cb', r.finished_at, nPlayers(r.max_players), a + ' vs ' + b, '🏆 ' + (r.winner_side === 'a' ? a : b) + ' · ' + r.side_a_score + '–' + r.side_b_score, (r.side_a_names || []).concat(r.side_b_names || []));
  });
  d.bw.forEach(r => push('bw', r.finished_at, nPlayers((r.players || []).length), names(r.players), '🏆 ' + esc(r.winner_name), r.players));
  d.dm.forEach(r => {
    const won = r.final_label || (r.final_amount != null ? r.final_amount.toLocaleString('fr-FR') + ' DT' : '?');
    const wilaya = r.candidate_wilaya ? ' (' + esc(r.candidate_wilaya) + ')' : '';
    push('dm', r.finished_at, '', esc(r.candidate_name) + wilaya + ' vs ' + esc(r.banker_name) + ' (banque)', (r.accepted_offer ? '🤝 Offre acceptée : ' : '💼 Mallette ouverte : ') + esc(won), [r.candidate_name, r.banker_name]);
  });
  d.tb.forEach(r => push('tb', r.finished_at, nPlayers((r.players || []).length), names(r.players), '🏆 ' + (r.winner_team === 'tie' ? 'Égalité' : 'Équipe ' + esc(r.winner_team)) + ' · ' + (r.scores || []).join('–'), r.players));
  d.ttt.forEach(r => push('ttt', r.finished_at, r.rounds > 1 ? ' · ' + r.rounds + ' manches' : '', esc(r.x_name) + ' (X) vs ' + esc(r.o_name) + ' (O)', '🏆 ' + esc(r.winner_name || 'Égalité') + ' · ' + r.x_score + '–' + r.o_score, [r.x_name, r.o_name]));
  d.mot.forEach(r => push('mot', r.finished_at, r.rounds > 1 ? ' · ' + r.rounds + ' manches' : '', esc(r.p1_name) + ' vs ' + esc(r.p2_name), '🏆 ' + esc(r.winner_name || 'Égalité') + ' · ' + r.p1_score + '–' + r.p2_score, [r.p1_name, r.p2_name]));
  // Group games save one shared row each (see gym-room.js).
  d.gr.forEach(r => { if(GAMES[r.game]) push(r.game, r.finished_at, nPlayers((r.players || []).length), r.detail ? esc(r.detail) : names(r.players), esc(r.result || ''), r.players); });
  out.sort((a, b) => new Date(b.ts) - new Date(a.ts));
  return out;
}

function dateKey(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today(){ const t = new Date(); t.setHours(0, 0, 0, 0); return t; }
function dayLabel(d){
  const diff = Math.round((today() - d) / 864e5);
  if(diff === 0) return "Aujourd'hui";
  if(diff === 1) return 'Hier';
  const s = d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function shiftDay(n){ selectedDate = new Date(selectedDate); selectedDate.setDate(selectedDate.getDate() + n); renderAll(); }
function onDateChange(){
  const v = $('date-picker').value;
  if(v){ const [y, m, d] = v.split('-').map(Number); selectedDate = new Date(y, m - 1, d); }
  renderAll();
}
function setFilter(k){ activeFilter = k; renderAll(); }

function renderAll(){
  $('day-title').textContent = dayLabel(selectedDate);
  $('date-picker').value = dateKey(selectedDate);
  $('next-day').disabled = selectedDate >= today();
  const dk = dateKey(selectedDate);
  const day = allEntries.filter(e => dateKey(new Date(e.ts)) === dk);
  // Chips: every game, the ones played that day first with their count.
  const count = {}; day.forEach(e => count[e.game] = (count[e.game] || 0) + 1);
  const keys = Object.keys(GAMES).sort((a, b) => (count[b] || 0) - (count[a] || 0));
  if(activeFilter !== 'all' && !GAMES[activeFilter]) activeFilter = 'all';
  $('filter-row').innerHTML = '<button class="chip' + (activeFilter === 'all' ? ' on' : '') + '" onclick="setFilter(\'all\')">Tous<i>' + day.length + '</i></button>' +
    keys.map(k => '<button class="chip' + (activeFilter === k ? ' on' : '') + '" onclick="setFilter(\'' + k + '\')">' + GAMES[k].emoji + ' ' + esc(GAMES[k].name) + (count[k] ? '<i>' + count[k] + '</i>' : '') + '</button>').join('');
  const players = new Set(); day.forEach(e => e.ps.forEach(p => players.add(String(p).trim().toLowerCase())));
  const top = keys[0] && count[keys[0]] ? GAMES[keys[0]].emoji : '–';
  $('stats').innerHTML = '<div class="stat"><b>' + day.length + '</b><span>parties</span></div><div class="stat"><b>' + players.size + '</b><span>joueurs</span></div><div class="stat"><b>' + top + '</b><span>le plus joué</span></div>';
  const list = activeFilter === 'all' ? day : day.filter(e => e.game === activeFilter);
  $('sec-loading').classList.add('hidden');
  $('sec-empty').classList.toggle('hidden', list.length > 0);
  $('list').innerHTML = list.map(e => {
    const g = GAMES[e.game], time = new Date(e.ts).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    return '<div class="row"><div class="badge" style="--c:' + g.c + ';--t:' + g.t + '">' + g.emoji + '</div><div class="body">' +
      '<div class="head"><span class="name">' + esc(g.name) + e.sub + '</span><span class="time">' + time + '</span></div>' +
      '<div class="who">' + e.who + '</div><div class="res">' + e.res + '</div></div></div>';
  }).join('');
}

async function loadAll(isRefresh){
  if(isRefresh) $('refresh-btn').classList.add('spin');
  const t = ['vt', 'sk', 'tm', 'cb', 'bw', 'dm', 'tb', 'ttt', 'mot'];
  const rows = await Promise.all(t.map(k => fetchRows(k + '_results')).concat([fetchRows('game_results')]));
  const d = {}; t.forEach((k, i) => d[k] = rows[i]); d.gr = rows[t.length];
  allEntries = buildEntries(d);
  renderAll();
  if(isRefresh) setTimeout(() => $('refresh-btn').classList.remove('spin'), 700);
}

renderAll();
$('sec-loading').classList.remove('hidden'); $('sec-empty').classList.add('hidden');
loadAll(false);
</script>
<script src="install-tutorial.js" defer></script>
</body>
</html>
