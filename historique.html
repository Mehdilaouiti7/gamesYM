<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Games YM · Historique</title>
<meta name="theme-color" content="#233a2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Games YM">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#24382e;
    --board-deep:#1b2c24;
    --chalk:#f3efe4;
    --chalk-dim:#c9c4b4;
    --butter:#e9c46a;
    --red-chalk:#e76f51;
    --blue-chalk:#8ecae6;
    --line:rgba(243,239,228,.18);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Fredoka',system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(233,196,106,.07), transparent 60%),
      linear-gradient(var(--board), var(--board-deep));
    color:var(--chalk);
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;
    padding:20px 16px 40px;
  }
  .frame{width:100%;max-width:460px}
  header{text-align:center;margin-bottom:14px}
  h1{font-weight:700;font-size:1.9rem;letter-spacing:.5px}
  .tagline{color:var(--chalk-dim);font-size:.9rem;margin-top:2px}
  .back-link{display:inline-block;margin-top:8px;color:var(--chalk-dim);font-size:.82rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
  .card{
    background:linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.02));
    backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
    border:1px solid rgba(243,239,228,.13);
    border-radius:var(--radius);
    padding:18px 16px;
    margin-bottom:14px;
    box-shadow:0 10px 26px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .card h2{font-size:1.05rem;font-weight:600;margin-bottom:10px}
  label{display:block;font-size:.85rem;color:var(--chalk-dim);margin:10px 0 4px}
  input[type=text]{
    width:100%;
    background:rgba(0,0,0,.25);
    border:1.5px dashed var(--line);
    border-radius:10px;
    color:var(--chalk);
    font-family:'Fredoka',sans-serif;
    font-size:1rem;
    padding:11px 12px;
    outline:none;
  }
  input:focus{border-color:var(--butter)}
  button{
    font-family:'Fredoka',sans-serif;
    font-weight:600;font-size:1rem;
    border:none;border-radius:13px;
    padding:13px 16px;width:100%;
    cursor:pointer;margin-top:12px;
    background:linear-gradient(160deg,#eecd7c,var(--butter));color:#3a2c10;
    box-shadow:0 6px 16px rgba(233,196,106,.18);
    transition:transform .12s cubic-bezier(.22,1,.36,1), filter .15s, opacity .15s;
  }
  button:active{transform:scale(.97);filter:brightness(.96)}
  button:disabled{opacity:.45;cursor:default}
  .muted{color:var(--chalk-dim);font-size:.85rem;line-height:1.45}
  .error{color:var(--red-chalk);font-size:.85rem;margin-top:8px;min-height:1.2em}
  .hidden{display:none !important}

  .totals-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px}
  .totals-row .side{text-align:center;flex:1}
  .totals-row .n{font-family:'Space Mono',monospace;font-size:2.1rem;font-weight:700;color:var(--butter)}
  .totals-row .nm{font-size:.9rem;color:var(--chalk-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .totals-row .vs{color:var(--chalk-dim);font-size:.78rem;text-align:center}
  .sub-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--chalk-dim);border-top:1px solid var(--line);padding-top:10px;margin-top:4px}

  .history-list{display:flex;flex-direction:column;gap:6px;max-height:48dvh;overflow-y:auto;padding:2px}
  .hrow{
    display:flex;align-items:center;gap:8px;
    padding:9px 10px;border-radius:10px;
    background:rgba(0,0,0,.18);
    font-size:.85rem;
  }
  .hdate{color:var(--chalk-dim);font-size:.75rem;width:70px;flex-shrink:0}
  .hgame{flex:1}
  .hwin{font-weight:600;white-space:nowrap}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
</style>
</head>
<body>
<div class="frame">
  <header>
    <h1>📊 Historique</h1>
    <div class="tagline">Le score de vos duels, toutes parties confondues</div>
    <a class="back-link" href="index.html">← Retour à l'accueil</a>
  </header>

  <div class="card">
    <h2>Vos prénoms</h2>
    <label>Ton prénom</label>
    <input type="text" id="name1" maxlength="12" placeholder="Ex. Léa">
    <label>Prénom de ton ami·e</label>
    <input type="text" id="name2" maxlength="12" placeholder="Ex. Emma">
    <div class="error" id="search-err"></div>
    <button id="btn-search" onclick="search()">Voir l'historique</button>
  </div>

  <div id="results" class="hidden">
    <div class="card hidden" id="sec-empty">
      <p class="muted" id="empty-text"></p>
    </div>
    <div class="card hidden" id="sec-vt">
      <h2>🐄 Vache &amp; Taureau</h2>
      <div class="totals-row" id="vt-totals"></div>
      <div class="history-list" id="vt-list"></div>
    </div>
    <div class="card hidden" id="sec-sk">
      <h2>🎴 Skyjo</h2>
      <div class="totals-row" id="sk-totals"></div>
      <div class="history-list" id="sk-list"></div>
    </div>
    <div class="card hidden" id="sec-tm">
      <h2>🧠 The Mind</h2>
      <p class="muted" id="tm-summary"></p>
      <div class="history-list" id="tm-list"></div>
    </div>
    <div class="card hidden" id="sec-cb">
      <h2>🃏 Chkobba</h2>
      <div class="totals-row" id="cb-totals"></div>
      <div class="history-list" id="cb-list"></div>
    </div>
    <div class="card hidden" id="sec-bw">
      <h2>📖 Bent Walad</h2>
      <div class="totals-row" id="bw-totals"></div>
      <div class="history-list" id="bw-list"></div>
    </div>
  </div>
</div>

<script>
const SB_URL = "https://mqfyuprpztiyfpleannt.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xZnl1cHJwenRpeWZwbGVhbm50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzMjg3MjUsImV4cCI6MjA4OTkwNDcyNX0.4Fvc-fNlwhVp0HvOEL-Z92i9W4YvVSAgen0ihBzlGOk";
const HEADERS = {
  "apikey": SB_KEY,
  "Authorization": "Bearer " + SB_KEY,
  "Content-Type": "application/json"
};
const $ = id => document.getElementById(id);
function esc(s){ return String(s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;'); }

async function fetchResults(table){
  try{
    const r = await fetch(SB_URL+"/rest/v1/"+table+"?select=*&order=finished_at.desc&limit=500", {headers:HEADERS});
    if(!r.ok) return [];
    return await r.json();
  }catch(e){ return []; }
}
function matchesPair(row, a, b){
  const p1 = row.p1_name.trim().toLowerCase(), p2 = row.p2_name.trim().toLowerCase();
  return (p1===a && p2===b) || (p1===b && p2===a);
}
function matchesTeam(row, a, b){
  const names = (row.players||[]).map(n => n.trim().toLowerCase());
  return names.includes(a) && names.includes(b);
}
function winsFor(rows, name){
  const n = name.trim().toLowerCase();
  return rows.filter(r => r.winner_name.trim().toLowerCase()===n).length;
}
function skPairScores(row, a, b){
  const names = (row.players||[]).map(n => n.trim().toLowerCase());
  const ia = names.indexOf(a), ib = names.indexOf(b);
  if(ia===-1 || ib===-1 || !row.scores) return null;
  return { scoreA: row.scores[ia], scoreB: row.scores[ib] };
}
function skWinsForPair(rows, a, b){
  let w1 = 0, w2 = 0;
  rows.forEach(r=>{
    const ps = skPairScores(r, a, b);
    if(!ps) return;
    if(ps.scoreA < ps.scoreB) w1++; else if(ps.scoreB < ps.scoreA) w2++;
  });
  return {w1, w2};
}
function cbSides(row, a, b){
  const namesA = (row.side_a_names||[]).map(n=>n.trim().toLowerCase());
  const namesB = (row.side_b_names||[]).map(n=>n.trim().toLowerCase());
  const aSide = namesA.includes(a) ? 'a' : (namesB.includes(a) ? 'b' : null);
  const bSide = namesA.includes(b) ? 'a' : (namesB.includes(b) ? 'b' : null);
  return { aSide, bSide };
}
function cbWinsForPair(rows, a, b){
  let w1 = 0, w2 = 0;
  rows.forEach(r=>{
    const { aSide, bSide } = cbSides(r, a, b);
    if(!aSide || !bSide || aSide===bSide) return;
    if(r.winner_side===aSide) w1++; else if(r.winner_side===bSide) w2++;
  });
  return {w1, w2};
}
function bwWinsForPair(rows, a, b){
  let w1 = 0, w2 = 0;
  rows.forEach(r=>{
    const ps = skPairScores(r, a, b);
    if(!ps) return;
    if(ps.scoreA > ps.scoreB) w1++; else if(ps.scoreB > ps.scoreA) w2++;
  });
  return {w1, w2};
}

async function search(){
  const n1 = $('name1').value.trim();
  const n2 = $('name2').value.trim();
  if(!n1 || !n2){ $('search-err').textContent = "Entre les deux prénoms."; return; }
  $('search-err').textContent = "";
  $('btn-search').disabled = true;

  const a = n1.toLowerCase(), b = n2.toLowerCase();
  const [vt, sk, tm, cb, bw] = await Promise.all([fetchResults('vt_results'), fetchResults('sk_results'), fetchResults('tm_results'), fetchResults('cb_results'), fetchResults('bw_results')]);
  $('btn-search').disabled = false;

  const vtRows = vt.filter(r => matchesPair(r, a, b)).map(r => Object.assign({}, r, {game:'vt'}));
  const skRows = sk.filter(r => matchesTeam(r, a, b)).map(r => Object.assign({}, r, {game:'sk'}));
  const tmRows = tm.filter(r => matchesTeam(r, a, b)).map(r => Object.assign({}, r, {game:'tm'}));
  const cbRows = cb.filter(r => matchesTeam(r, a, b)).map(r => Object.assign({}, r, {game:'cb'}));
  const bwRows = bw.filter(r => matchesTeam(r, a, b)).map(r => Object.assign({}, r, {game:'bw'}));

  renderResults(n1, n2, vtRows, skRows, tmRows, cbRows, bwRows);
}

function historyRowHtml(dateIso, label, rightText){
  const date = new Date(dateIso);
  const dateStr = date.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'}) + ' ' + date.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  return '<div class="hrow"><span class="hdate">'+dateStr+'</span><span class="hgame">'+label+'</span><span class="hwin">'+rightText+'</span></div>';
}
function totalsRowHtml(n1, w1, n2, w2, count){
  return '<div class="side"><div class="n">'+w1+'</div><div class="nm">'+esc(n1)+'</div></div>'+
    '<div class="vs">victoires<br>'+count+' partie'+(count>1?'s':'')+'</div>'+
    '<div class="side"><div class="n">'+w2+'</div><div class="nm">'+esc(n2)+'</div></div>';
}

function renderResults(n1, n2, vtRows, skRows, tmRows, cbRows, bwRows){
  $('results').classList.remove('hidden');
  const anyData = vtRows.length || skRows.length || tmRows.length || cbRows.length || bwRows.length;
  $('sec-empty').classList.toggle('hidden', !!anyData);
  if(!anyData){
    $('empty-text').textContent = "Aucune partie trouvée entre "+esc(n1)+" et "+esc(n2)+" pour l'instant. Jouez une partie pour commencer l'historique !";
  }

  $('sec-vt').classList.toggle('hidden', vtRows.length===0);
  if(vtRows.length){
    const vtW1 = winsFor(vtRows, n1), vtW2 = winsFor(vtRows, n2);
    $('vt-totals').innerHTML = totalsRowHtml(n1, vtW1, n2, vtW2, vtRows.length);
    $('vt-list').innerHTML = vtRows.map(r =>
      historyRowHtml(r.finished_at, '🐄 Vache &amp; Taureau', '🏆 '+esc(r.winner_name))
    ).join('');
  }

  $('sec-sk').classList.toggle('hidden', skRows.length===0);
  if(skRows.length){
    const a = n1.toLowerCase(), b = n2.toLowerCase();
    const skPair = skWinsForPair(skRows, a, b);
    $('sk-totals').innerHTML = totalsRowHtml(n1, skPair.w1, n2, skPair.w2, skRows.length);
    $('sk-list').innerHTML = skRows.map(r=>{
      const ps = skPairScores(r, a, b);
      const scoreStr = ps ? ' · '+ps.scoreA+'–'+ps.scoreB : '';
      const groupStr = r.max_players>2 ? ' ('+r.max_players+' joueurs)' : '';
      return historyRowHtml(r.finished_at, '🎴 Skyjo'+groupStr+scoreStr, '🏆 '+esc(r.winner_name));
    }).join('');
  }

  $('sec-tm').classList.toggle('hidden', tmRows.length===0);
  if(tmRows.length){
    const tmWins = tmRows.filter(r => r.won).length;
    $('tm-summary').textContent = tmWins+' victoire'+(tmWins>1?'s':'')+" d'équipe sur "+tmRows.length+' partie'+(tmRows.length>1?'s':'')+' jouées ensemble.';
    $('tm-list').innerHTML = tmRows.map(r=>{
      const result = r.won ? '✅ victoire' : '❌ niveau '+r.level_reached;
      return historyRowHtml(r.finished_at, '🧠 The Mind ('+r.max_players+' joueurs)', result);
    }).join('');
  }

  $('sec-cb').classList.toggle('hidden', cbRows.length===0);
  if(cbRows.length){
    const a = n1.toLowerCase(), b = n2.toLowerCase();
    const cbPair = cbWinsForPair(cbRows, a, b);
    $('cb-totals').innerHTML = totalsRowHtml(n1, cbPair.w1, n2, cbPair.w2, cbRows.length);
    $('cb-list').innerHTML = cbRows.map(r=>{
      const sideANames = (r.side_a_names||[]).join(' & ');
      const sideBNames = (r.side_b_names||[]).join(' & ');
      const winnerNames = r.winner_side==='a' ? sideANames : sideBNames;
      const groupStr = r.max_players>2 ? ' ('+r.max_players+' joueurs)' : '';
      const label = '🃏 Chkobba'+groupStr+' · '+r.side_a_score+'–'+r.side_b_score;
      return historyRowHtml(r.finished_at, label, '🏆 '+esc(winnerNames));
    }).join('');
  }

  $('sec-bw').classList.toggle('hidden', bwRows.length===0);
  if(bwRows.length){
    const a = n1.toLowerCase(), b = n2.toLowerCase();
    const bwPair = bwWinsForPair(bwRows, a, b);
    $('bw-totals').innerHTML = totalsRowHtml(n1, bwPair.w1, n2, bwPair.w2, bwRows.length);
    $('bw-list').innerHTML = bwRows.map(r=>{
      const ps = skPairScores(r, a, b);
      const scoreStr = ps ? ' · '+ps.scoreA+'–'+ps.scoreB : '';
      const groupStr = r.players.length>2 ? ' ('+r.players.length+' joueurs)' : '';
      return historyRowHtml(r.finished_at, '📖 Bent Walad'+groupStr+scoreStr, '🏆 '+esc(r.winner_name));
    }).join('');
  }
}

document.addEventListener('keydown', e=>{
  if(e.key==='Enter') search();
});
</script>
<script src="install-tutorial.js" defer></script>
</body>
</html>
