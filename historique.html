<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historique — scores entre amis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#24382e;
    --board-deep:#1b2c24;
    --chalk:#f3efe4;
    --chalk-dim:#c9c4b4;
    --butter:#e9c46a;
    --red-chalk:#e76f51;
    --blue-chalk:#8ecae6;
    --line:rgba(243,239,228,.18);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Fredoka',system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(233,196,106,.07), transparent 60%),
      linear-gradient(var(--board), var(--board-deep));
    color:var(--chalk);
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;
    padding:20px 16px 40px;
  }
  .frame{width:100%;max-width:460px}
  header{text-align:center;margin-bottom:14px}
  h1{font-weight:700;font-size:1.9rem;letter-spacing:.5px}
  .tagline{color:var(--chalk-dim);font-size:.9rem;margin-top:2px}
  .back-link{display:inline-block;margin-top:8px;color:var(--chalk-dim);font-size:.82rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
  .card{
    background:rgba(255,255,255,.045);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 16px;
    margin-bottom:14px;
  }
  .card h2{font-size:1.05rem;font-weight:600;margin-bottom:10px}
  label{display:block;font-size:.85rem;color:var(--chalk-dim);margin:10px 0 4px}
  input[type=text]{
    width:100%;
    background:rgba(0,0,0,.25);
    border:1.5px dashed var(--line);
    border-radius:10px;
    color:var(--chalk);
    font-family:'Fredoka',sans-serif;
    font-size:1rem;
    padding:11px 12px;
    outline:none;
  }
  input:focus{border-color:var(--butter)}
  button{
    font-family:'Fredoka',sans-serif;
    font-weight:600;font-size:1rem;
    border:none;border-radius:12px;
    padding:13px 16px;width:100%;
    cursor:pointer;margin-top:12px;
    background:var(--butter);color:#3a2c10;
    transition:transform .08s ease, opacity .15s;
  }
  button:active{transform:scale(.98)}
  button:disabled{opacity:.45;cursor:default}
  .muted{color:var(--chalk-dim);font-size:.85rem;line-height:1.45}
  .error{color:var(--red-chalk);font-size:.85rem;margin-top:8px;min-height:1.2em}
  .hidden{display:none !important}

  .totals-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px}
  .totals-row .side{text-align:center;flex:1}
  .totals-row .n{font-family:'Space Mono',monospace;font-size:2.1rem;font-weight:700;color:var(--butter)}
  .totals-row .nm{font-size:.9rem;color:var(--chalk-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .totals-row .vs{color:var(--chalk-dim);font-size:.78rem;text-align:center}
  .sub-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--chalk-dim);border-top:1px solid var(--line);padding-top:10px;margin-top:4px}

  .history-list{display:flex;flex-direction:column;gap:6px;max-height:48dvh;overflow-y:auto;padding:2px}
  .hrow{
    display:flex;align-items:center;gap:8px;
    padding:9px 10px;border-radius:10px;
    background:rgba(0,0,0,.18);
    font-size:.85rem;
  }
  .hdate{color:var(--chalk-dim);font-size:.75rem;width:70px;flex-shrink:0}
  .hgame{flex:1}
  .hwin{font-weight:600;white-space:nowrap}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
</style>
</head>
<body>
<div class="frame">
  <header>
    <h1>📊 Historique</h1>
    <div class="tagline">Le score de vos duels, toutes parties confondues</div>
    <a class="back-link" href="index.html">← Retour à l'accueil</a>
  </header>

  <div class="card">
    <h2>Vos prénoms</h2>
    <label>Ton prénom</label>
    <input type="text" id="name1" maxlength="12" placeholder="Ex. Léa">
    <label>Prénom de ton ami·e</label>
    <input type="text" id="name2" maxlength="12" placeholder="Ex. Emma">
    <div class="error" id="search-err"></div>
    <button id="btn-search" onclick="search()">Voir l'historique</button>
  </div>

  <div id="results" class="hidden">
    <div class="card" id="summary"></div>
    <div class="card">
      <h2>Parties récentes</h2>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>
</div>

<script>
const SB_URL = "https://mqfyuprpztiyfpleannt.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xZnl1cHJwenRpeWZwbGVhbm50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzMjg3MjUsImV4cCI6MjA4OTkwNDcyNX0.4Fvc-fNlwhVp0HvOEL-Z92i9W4YvVSAgen0ihBzlGOk";
const HEADERS = {
  "apikey": SB_KEY,
  "Authorization": "Bearer " + SB_KEY,
  "Content-Type": "application/json"
};
const $ = id => document.getElementById(id);
function esc(s){ return String(s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;'); }

async function fetchResults(table){
  try{
    const r = await fetch(SB_URL+"/rest/v1/"+table+"?select=*&order=finished_at.desc&limit=500", {headers:HEADERS});
    if(!r.ok) return [];
    return await r.json();
  }catch(e){ return []; }
}
function matchesPair(row, a, b){
  const p1 = row.p1_name.trim().toLowerCase(), p2 = row.p2_name.trim().toLowerCase();
  return (p1===a && p2===b) || (p1===b && p2===a);
}
function winsFor(rows, name){
  const n = name.trim().toLowerCase();
  return rows.filter(r => r.winner_name.trim().toLowerCase()===n).length;
}

async function search(){
  const n1 = $('name1').value.trim();
  const n2 = $('name2').value.trim();
  if(!n1 || !n2){ $('search-err').textContent = "Entre les deux prénoms."; return; }
  $('search-err').textContent = "";
  $('btn-search').disabled = true;

  const a = n1.toLowerCase(), b = n2.toLowerCase();
  const [vt, sk] = await Promise.all([fetchResults('vt_results'), fetchResults('sk_results')]);
  $('btn-search').disabled = false;

  const vtRows = vt.filter(r => matchesPair(r, a, b)).map(r => Object.assign({}, r, {game:'vt'}));
  const skRows = sk.filter(r => matchesPair(r, a, b)).map(r => Object.assign({}, r, {game:'sk'}));
  const all = vtRows.concat(skRows).sort((x, y) => new Date(y.finished_at) - new Date(x.finished_at));

  renderResults(n1, n2, all, vtRows, skRows);
}

function renderResults(n1, n2, all, vtRows, skRows){
  $('results').classList.remove('hidden');
  if(all.length===0){
    $('summary').innerHTML = '<p class="muted">Aucune partie trouvée entre '+esc(n1)+' et '+esc(n2)+' pour l\'instant. Jouez une partie pour commencer l\'historique !</p>';
    $('history-list').innerHTML = "";
    return;
  }
  const vtW1 = winsFor(vtRows, n1), vtW2 = winsFor(vtRows, n2);
  const skW1 = winsFor(skRows, n1), skW2 = winsFor(skRows, n2);
  const totalW1 = vtW1 + skW1, totalW2 = vtW2 + skW2;

  $('summary').innerHTML =
    '<h2>Score total</h2>'+
    '<div class="totals-row">'+
      '<div class="side"><div class="n">'+totalW1+'</div><div class="nm">'+esc(n1)+'</div></div>'+
      '<div class="vs">victoires<br>'+all.length+' partie'+(all.length>1?'s':'')+'</div>'+
      '<div class="side"><div class="n">'+totalW2+'</div><div class="nm">'+esc(n2)+'</div></div>'+
    '</div>'+
    '<div class="sub-row"><span>🐄 Vache &amp; Taureau : '+vtW1+' – '+vtW2+'</span><span>🎴 Skyjo : '+skW1+' – '+skW2+'</span></div>';

  $('history-list').innerHTML = all.map(r=>{
    const date = new Date(r.finished_at);
    const dateStr = date.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'}) + ' ' + date.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    const icon = r.game==='vt' ? '🐄' : '🎴';
    const label = r.game==='vt' ? 'Vache & Taureau' : 'Skyjo';
    const scoreStr = r.game==='sk' ? ' · '+r.p1_score+'–'+r.p2_score : '';
    return '<div class="hrow"><span class="hdate">'+dateStr+'</span><span class="hgame">'+icon+' '+label+scoreStr+'</span><span class="hwin">🏆 '+esc(r.winner_name)+'</span></div>';
  }).join('');
}

document.addEventListener('keydown', e=>{
  if(e.key==='Enter') search();
});
</script>
</body>
</html>
